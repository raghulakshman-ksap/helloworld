services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # JSON list; origins the browser loads the web app from.
      API_CORS_ORIGINS: '["http://localhost:3000"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        # Called from the user's browser, so this is the host-published API port.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
